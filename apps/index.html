<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Shelf</title>
<style>
  :root {
    --bg: #06070c;
    --card: rgba(20, 22, 34, 0.6);
    --stroke: rgba(255, 255, 255, 0.10);
    --text: #e8eaf2;
    --muted: #8b91a8;
    --accent: #6ee7ff;
    --accent-2: #b48cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 ui-sans-serif, -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 72px 32px 64px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(50vw 50vw at 15% 0%, rgba(110, 231, 255, 0.13), transparent 60%),
      radial-gradient(45vw 45vw at 85% 100%, rgba(180, 140, 255, 0.13), transparent 60%);
  }
  .wrap { position: relative; max-width: 900px; margin: 0 auto; }

  header { margin-bottom: 40px; }
  h1 {
    margin: 0;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.03em;
    background: linear-gradient(100deg, var(--accent), var(--accent-2) 70%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { margin: 6px 0 0; color: var(--muted); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  a.card {
    display: block;
    padding: 20px;
    border-radius: 18px;
    border: 1px solid var(--stroke);
    background: var(--card);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s, box-shadow 0.2s;
  }
  a.card:hover {
    transform: translateY(-4px);
    border-color: rgba(110, 231, 255, 0.45);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
  }
  .icon {
    width: 38px; height: 38px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    font-size: 19px;
    margin-bottom: 14px;
    background: linear-gradient(135deg, rgba(110, 231, 255, 0.22), rgba(180, 140, 255, 0.22));
    border: 1px solid var(--stroke);
  }
  .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .card p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .tag {
    display: inline-block;
    margin-top: 12px;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid var(--stroke);
    font: 10px ui-monospace, "SF Mono", monospace;
    color: var(--muted);
  }

  .empty {
    padding: 28px;
    border: 1px dashed var(--stroke);
    border-radius: 18px;
    color: var(--muted);
    font: 12.5px ui-monospace, "SF Mono", monospace;
  }
  footer { margin-top: 44px; color: var(--muted); font-size: 12px; }
  code { font: 11.5px ui-monospace, "SF Mono", monospace; color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>App Shelf</h1>
    <p>Small self-contained apps. Each one lives in its own folder and opens straight in the browser.</p>
  </header>

  <!-- Add a card here when you add a folder under apps/ -->
  <div class="grid">
    <a class="card" href="flow-field-studio/index.html">
      <div class="icon">🌀</div>
      <h2>Flow Field Studio</h2>
      <p>Perlin-noise particle flow with live controls and PNG export.</p>
      <span class="tag">canvas · no deps</span>
    </a>
  </div>

  <footer>
    New app: <code>mkdir apps/my-app</code>, drop an <code>index.html</code> in it, then add a card above.
  </footer>
</div>
</body>
</html>
